[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamics_of_mechanical_systems"
version = "0.1.0"
description = "A package for dynamics of mechanical systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Jonathan Camargo", email = "jon-cama@uniandes.edu.co" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "matplotlib",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "sphinx>=4.0",
]

[project.urls]
Homepage = "https://github.com/JonathanCamargo/dynamics_of_mechanical_systems"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dms = ["assets/mujoco_models/*.xml"]
